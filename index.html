<!DOCTYPE html>
<html>
<head>
    <title>Laptop Price Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }
        .container {
            background: #fff;
            padding: 25px 40px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        label {
            margin-top: 10px;
            display: block;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
            color: #007bff;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Laptop Price Predictor</h2>
    <form id="predictForm">
        <label for="brand">Brand:</label>
        <select id="brand" name="brand">
            <option value="HP">HP</option>
            <option value="Dell">Dell</option>
            <option value="Lenovo">Lenovo</option>
            <option value="Asus">Asus</option>
        </select>

        <label for="ram">RAM (in GB):</label>
        <input type="number" id="ram" name="ram" required>

        <label for="ssd">SSD (in GB):</label>
        <input type="number" id="ssd" name="ssd" required>

        <label for="cpu">CPU:</label>
        <select id="cpu" name="cpu">
            <option value="i3">Intel i3</option>
            <option value="i5">Intel i5</option>
            <option value="i7">Intel i7</option>
            <option value="Ryzen 5">AMD Ryzen 5</option>
        </select>

        <button type="submit">Predict Price</button>
    </form>

    <div class="result" id="result"></div>
</div>

<script>
    document.getElementById('predictForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // Placeholder result text until connected to backend
        document.getElementById('result').innerText = 'Predicted Price: ₹45,000 (example)';
        // In real use, send form data to Flask backend using fetch/AJAX
    });
</script>

</body>
</html>
